<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Astro Dating - Find Your Cosmic Match</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
      color: white;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
    }
    h1 {
      text-align: center;
      color: #ffcc00;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    button {
      background: #ff6b6b;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #ff4757;
    }
    #result, #matches {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
    }
    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌟 Astro Dating 🌟</h1>
    <p>Enter your details to register and find cosmic matches!</p>

    <h2>Register</h2>
    <input id="name" placeholder="Your Name" type="text" />
    <input id="birthDate" placeholder="Birth Date (YYYY/MM/DD)" type="text" />
    <input id="birthTime" placeholder="Birth Time (HH:MM)" type="text" />
    <input id="birthPlace" placeholder="Birth Place (e.g. Deerfield Beach, FL)" type="text" />
    <button onclick="registerUser()">Register Me</button>

    <h2>Find Matches</h2>
    <input id="userId" placeholder="Your User ID (from register response)" type="number" />
    <button onclick="getMatches()">Show My Matches</button>

    <div id="result"></div>
    <div id="matches"></div>
  </div>

  <script>
    const API_URL = "https://astro-dating-api.onrender.com";  // ← your Render URL

    async function registerUser() {
      const name = document.getElementById('name').value.trim();
      const birthDate = document.getElementById('birthDate').value.trim();
      const birthTime = document.getElementById('birthTime').value.trim();
      const birthPlace = document.getElementById('birthPlace').value.trim();

      if (!name || !birthDate || !birthTime || !birthPlace) {
        alert("Please fill all fields!");
        return;
      }

      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = "Registering...";

      try {
        const response = await fetch(`${API_URL}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, birthDate, birthTime, birthPlace })
        });

        const data = await response.json();

        if (response.ok) {
          resultDiv.innerHTML = `
            <strong>Success!</strong><br>
            User ID: ${data.id}<br>
            Signs: Sun=${data.signs.sun}, Moon=${data.signs.moon}, Rising=${data.signs.rising}
          `;
        } else {
          resultDiv.innerHTML = `Error: ${data.error || 'Unknown error'}`;
        }
      } catch (err) {
        resultDiv.innerHTML = `Network error: ${err.message}`;
      }
    }

    async function getMatches() {
      const userId = document.getElementById('userId').value.trim();
      if (!userId) {
        alert("Enter your User ID!");
        return;
      }

      const matchesDiv = document.getElementById('matches');
      matchesDiv.innerHTML = "Loading matches...";

      try {
        const response = await fetch(`${API_URL}/match/${userId}`);
        const data = await response.json();

        if (response.ok) {
          if (data.matches.length === 0) {
            matchesDiv.innerHTML = "<strong>No matches yet</strong> (register more users to see compatibility!)";
          } else {
            let html = "<strong>Your Matches:</strong><ul>";
            data.matches.forEach(m => {
              html += `<li>${m.name} - Compatibility: ${m.score}%</li>`;
            });
            html += "</ul>";
            matchesDiv.innerHTML = html;
          }
        } else {
          matchesDiv.innerHTML = `Error: ${data.error || 'User not found'}`;
        }
      } catch (err) {
        matchesDiv.innerHTML = `Network error: ${err.message}`;
      }
    }
  </script>
</body>
</html>
