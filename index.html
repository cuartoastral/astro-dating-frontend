<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Astro Dating - Find Your Cosmic Match</title>
  <style>
    body { font-family: Arial, sans-serif; background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e); color: white; margin: 0; padding: 20px; min-height: 100vh; }
    .container { max-width: 600px; margin: 0 auto; background: rgba(255,255,255,0.1); padding: 30px; border-radius: 15px; backdrop-filter: blur(10px); }
    h1 { text-align: center; color: #ffcc00; }
    label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: bold; }
    input, button { width: 100%; padding: 12px; margin: 5px 0 15px 0; border-radius: 8px; border: none; font-size: 16px; box-sizing: border-box; }
    button { background: #ff6b6b; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #ff4757; }
    #result, #matches { margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 10px; min-height: 80px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌟 Astro Dating 🌟</h1>
    <p>Enter your details to register and find cosmic matches!</p>

    <h2>Register</h2>
    
    <label for="name">Your Name</label>
    <input id="name" placeholder="Your Name" type="text" required />

    <label for="email">Your Email</label>
    <input id="email" placeholder="your.email@example.com" type="email" required />

    <label for="birthDate">Birth Date (YYYY/MM/DD)</label>
    <input id="birthDate" placeholder="1990/05/20" type="text" required />

    <label for="birthTime">Birth Time (HH:MM, 24-hour format)</label>
    <input id="birthTime" placeholder="14:30" type="text" required />

    <label for="birthPlace">Birth Place (City, Country)</label>
    <input id="birthPlace" placeholder="Deerfield Beach, FL" type="text" required />

    <button onclick="registerUser()">Register Me</button>

    <h2>Find Matches</h2>
    <label for="userId">Your User ID (from register response)</label>
    <input id="userId" placeholder="e.g. 1" type="number" required />
    <button onclick="getMatches()">Show My Matches</button>

    <div id="result"></div>
    <div id="matches"></div>
  </div>
<script>
  const API_URL = "https://astro-dating-api.onrender.com";

  async function registerUser() {
    const name       = document.getElementById('name').value.trim();
    const email      = document.getElementById('email').value.trim();
    const birthDate  = document.getElementById('birthDate').value.trim();
    const birthTime  = document.getElementById('birthTime').value.trim();
    const birthPlace = document.getElementById('birthPlace').value.trim();

    if (!name || !email || !birthDate || !birthTime || !birthPlace) {
      alert("Please fill all required fields!");
      return;
    }

    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = "Registering... (API may take 10–30 seconds to wake up)";

    try {
      const response = await fetch(`${API_URL}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, birthDate, birthTime, birthPlace }),
        mode: 'cors',
        cache: 'no-cache',
        redirect: 'follow'
      });

      let data;
      try {
        data = await response.json();
      } catch {
        resultDiv.innerHTML = "Error: Server returned invalid JSON";
        return;
      }

      if (response.ok) {
        const signs = data.signs || {};
        resultDiv.innerHTML = `
          <strong>Success!</strong><br>
          User ID: <strong>${data.id || 'Unknown'}</strong><br>
          Signs: Sun=${signs.sun || 'Unknown'}, Moon=${signs.moon || 'Unknown'}, Rising=${signs.rising || 'Unknown'}<br>
          <br>Copy your User ID to find matches!
        `;
      } else {
        resultDiv.innerHTML = `Error: ${data.error || 'Unknown server error'} (Status ${response.status})`;
      }
    } catch (err) {
      resultDiv.innerHTML = `Network error: ${err.message}<br>Try again in 15–30 seconds (Render may be sleeping)`;
    }
  }

  async function getMatches() {
    const userId = document.getElementById('userId').value.trim();
    if (!userId) {
      alert("Enter your User ID!");
      return;
    }

    const matchesDiv = document.getElementById('matches');
    matchesDiv.innerHTML = "Loading matches...";

    try {
      const response = await fetch(`${API_URL}/match/${userId}`, {
        mode: 'cors',
        cache: 'no-cache'
      });

      let data;
      try {
        data = await response.json();
      } catch {
        matchesDiv.innerHTML = "Error: Server returned invalid JSON";
        return;
      }

      if (response.ok) {
        if (data.matches.length === 0) {
          matchesDiv.innerHTML = "<strong>No matches yet</strong><br>Register more users to see compatibility!";
        } else {
          let html = "<strong>Your Matches:</strong><ul>";
          data.matches.forEach(m => {
            html += `<li>${m.name} - Compatibility: ${m.score}%</li>`;
          });
          html += "</ul>";
          matchesDiv.innerHTML = html;
        }
      } else {
        matchesDiv.innerHTML = `Error: ${data.error || 'Unknown error'} (Status ${response.status})`;
      }
    } catch (err) {
      matchesDiv.innerHTML = `Network error: ${err.message}`;
    }
  }
</script>
  </body>
</html>
